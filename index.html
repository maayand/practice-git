<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body onload="onInit()">
    <div class="controls">
        <button id="btn-undo" onclick="onUndo()">Undo</button>
        <button id="btn-redo" onclick="onRedo()">Redo</button>
        <span class="timer">Time: 0s</span>
    </div>
    <h1>The Ball Game</h1>
    <div class="ball-1" onclick="onBallClick(this,300)">100</div>
    <div class="ball-2" onclick="onBallClick(this,400)">100</div>
    <div class="ball-3" onclick="onThiredBallClick()">100</div>
    <div class="ball-4" onclick="onFourthBallClick()">100</div>
    <div class="ball-5" onclick="onChangeBackgroundColor()">BG</div>
    <div class="ball-6" 
        onclick="onResetGame()"
        onmouseenter="startHoverTimer()" 
        onmouseleave="stopHoverTimer()">
        Reset
    </div>
</body>
<script src="util.js"></script>
<script src="main.js"></script>
</html>
